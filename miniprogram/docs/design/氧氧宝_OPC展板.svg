<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1100mm" height="1600mm" viewBox="0 0 1100 1600" font-family="Microsoft YaHei, PingFang SC, sans-serif">
<defs>
  <linearGradient id="gTop" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#16362E"/><stop offset="1" stop-color="#1E4D3F"/>
  </linearGradient>
  <linearGradient id="gBot" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1E4D3F"/><stop offset="1" stop-color="#16362E"/>
  </linearGradient>
  <linearGradient id="gMint" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2EC4B6"/><stop offset="1" stop-color="#209E92"/>
  </linearGradient>
  <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#16362E" flood-opacity="0.08"/>
  </filter>
  <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#16362E" flood-opacity="0.10"/>
  </filter>
  <clipPath id="avatarClip"><circle cx="190" cy="350" r="78"/></clipPath>
  <clipPath id="ipClip"><circle cx="92" cy="86" r="58"/></clipPath>
</defs>

<rect width="1100" height="1600" fill="#EBF5F1"/>

<rect x="0" y="0" width="1100" height="240" fill="url(#gTop)"/>
