<image href="assets/ip-badge.png" x="34" y="26" width="116" height="116"
       clip-path="url(#ipClip)" preserveAspectRatio="xMidYMid slice"/>
<circle cx="92" cy="84" r="58" fill="none" stroke="#7BDCD0" stroke-width="2.5" opacity="0.7"/>
<!-- 赛事名 -->
<text x="172" y="52" font-size="23" fill="#C9E9DE">北京大学生"超级个体"（OPC）创业大赛 · 2026</text>
<!-- 右上: 03 角标 + CASE 19 大字(最显著元素) -->
<rect x="850" y="28" width="54" height="30" rx="15" fill="#FFB86B"/>
<text x="877" y="49" font-size="20" font-weight="bold" fill="#16362E" text-anchor="middle">03</text>
<text x="1060" y="60" font-size="42" font-weight="bold" fill="#7BDCD0" text-anchor="end" letter-spacing="1">CASE 19</text>
<line x1="60" y1="66" x2="1040" y2="66" stroke="#2EC4B6" stroke-width="1" opacity="0.35"/>
<!-- 主标题 + 副标题 -->
<text x="550" y="128" font-size="70" font-weight="bold" fill="#FFFFFF"
      text-anchor="middle" letter-spacing="5">氧氧宝小程序应用</text>
<text x="550" y="168" font-size="28" fill="#7BDCD0" text-anchor="middle" letter-spacing="2">氧气情绪能量管理 · AI 陪伴小程序（产品 IP：氧氧）</text>
<!-- 价值主张胶囊(两行) -->
<rect x="100" y="182" width="900" height="50" rx="25" fill="url(#gMint)" filter="url(#cardShadow)"/>
<text x="550" y="203" font-size="19" fill="#FFFFFF" text-anchor="middle">面向高原、运动、脑疲劳及银发场景用户，</text>
<text x="550" y="225" font-size="19" font-weight="600" fill="#FFFFFF" text-anchor="middle">通过硬件连接与 AI 陪伴，感知双氧状态，实现智能化健康陪伴</text>

<g>
  <rect x="40" y="258" width="6" height="30" rx="3" fill="#2EC4B6"/>
  <text x="56" y="282" font-size="28" font-weight="bold" fill="#16362E">项目发起人</text>
  <text x="1060" y="282" font-size="19" fill="#5A7E72" text-anchor="end">人机协同 · 超级个体（人 + AI）</text>
  <line x1="205" y1="275" x2="1060" y2="275" stroke="#BFDCD2" stroke-width="1.5"/>
</g>

<!-- 左侧: 人物卡 (含证件照/身份/人机协同) -->
<g filter="url(#cardShadow)">
  <rect x="40" y="296" width="300" height="292" rx="24" fill="#FFFFFF"/>
  <image href="assets/portrait_lobster.png" x="118" y="274" width="144" height="144"
         clip-path="url(#avatarClip)" preserveAspectRatio="xMidYMid slice"/>
  <circle cx="190" cy="346" r="72" fill="none" stroke="#2EC4B6" stroke-width="3"/>
  <text x="190" y="452" font-size="32" font-weight="bold" fill="#16362E" text-anchor="middle">杨子涵</text>
  <text x="190" y="486" font-size="20" fill="#5A7E72" text-anchor="middle">北京工商大学</text>
  <text x="190" y="512" font-size="20" fill="#5A7E72" text-anchor="middle">商学院 · 供应链管理</text>
  <rect x="64" y="528" width="252" height="30" rx="15" fill="#E3F6F2" stroke="#2EC4B6" stroke-width="1.2"/>
  <text x="190" y="549" font-size="17" font-weight="600" fill="#209E92" text-anchor="middle">产品负责人 · 需求/设计/验收</text>
  <text x="190" y="581" font-size="15" fill="#5A7E72" text-anchor="middle">人：需求定义·场景设计·决策验收 ｜ AI：架构·代码·视觉优化</text>
</g>

<!-- 右侧: 项目背景 -->
<g filter="url(#cardShadow)">
  <rect x="366" y="296" width="694" height="112" rx="20" fill="#FFFFFF"/>
  <text x="392" y="328" font-size="22" font-weight="bold" fill="#16362E"><tspan fill="#FFB86B">●</tspan> 项目背景</text>
  <text x="392" y="356" font-size="16" fill="#334455">珠海横琴我可爱科技主营永磁体氧气富集富氧设备，覆盖高原/运动/脑疲劳/银发四类场景；</text>
  <text x="392" y="380" font-size="16" fill="#334455">氧氧宝作为充氧宝硬件生态的软件智能层，通过 AI 交互连接用户感受与设备数据，</text>
  <text x="392" y="404" font-size="16" fill="#334455">探索从"补氧设备"到"智能陪伴"的升级。</text>
</g>

<!-- 右侧: 目标用户 · 四大应用场景 -->
<g filter="url(#cardShadow)">
  <rect x="366" y="420" width="694" height="80" rx="20" fill="#FFFFFF"/>
  <text x="392" y="452" font-size="22" font-weight="bold" fill="#16362E"><tspan fill="#7CCFEA">●</tspan> 目标用户 · 四大应用场景（企业原始场景）</text>
  <rect x="392" y="462" width="330" height="24" rx="12" fill="#EAF7FE"/>
  <text x="557" y="479" font-size="14" fill="#1674C8" text-anchor="middle">① 高原 · 随身补氧安心陪伴</text>
  <rect x="732" y="462" width="316" height="24" rx="12" fill="#EAF7FE"/>
  <text x="890" y="479" font-size="14" fill="#1674C8" text-anchor="middle">② 运动 · 高强度耗氧恢复</text>
  <rect x="392" y="490" width="330" height="24" rx="12" fill="#EAF7FE"/>
  <text x="557" y="507" font-size="14" fill="#1674C8" text-anchor="middle">③ 脑疲劳 · 用脑过度提神舒缓</text>
  <rect x="732" y="490" width="316" height="24" rx="12" fill="#EAF7FE"/>
  <text x="890" y="507" font-size="14" fill="#1674C8" text-anchor="middle">④ 银发 · 居家康养健康陪伴</text>
</g>

<!-- 右侧: 核心问题·痛点 -->
<g filter="url(#cardShadow)">
  <rect x="366" y="512" width="694" height="76" rx="20" fill="#FFFFFF"/>
  <text x="392" y="540" font-size="22" font-weight="bold" fill="#16362E"><tspan fill="#FFB86B">●</tspan> 核心问题 · 痛点</text>
  <text x="392" y="564" font-size="15" fill="#334455">① 补氧设备缺数字化入口 → 需求难持续触达，使用频次与连接不足</text>
  <text x="392" y="588" font-size="15" fill="#334455">② 情绪易忽视、硬件缺陪伴触点 → 难以建立情感连接与长期粘性</text>
</g>

<g>
