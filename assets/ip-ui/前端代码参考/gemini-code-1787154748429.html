<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>氧氧宝 V0.8 - UI 原型展示</title>
  <style>
    /* 全局基础样式 */
    :root {
      --primary-color: #00B894;
      --primary-light: #E6F7F3;
      --text-main: #2D3436;
      --text-sub: #636E72;
      --bg-color: #F7F9FA;
      --card-bg: #FFFFFF;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
      --radius-lg: 20px;
      --radius-md: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: #EBF1F5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: var(--text-main);
    }

    /* 模拟手机容器 */
    .app-container {
      width: 390px;
      height: 844px;
      background-color: var(--bg-color);
      border-radius: 40px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
      border: 8px solid #2D3436;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* 滚动主内容区 */
    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      padding-bottom: 80px; /* 留出 TabBar 空间 */
    }

    .main-content::-webkit-scrollbar {
      display: none;
    }

    /* 通用卡片容器 */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-subtitle {
      font-size: 11px;
      color: var(--text-sub);
      font-weight: normal;
    }

    /* 1. 氧氧欢迎区 */
    .welcome-card {
      background: linear-gradient(135deg, #00B894 0%, #55E6C1 100%);
      color: white;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .ip-avatar {
      width: 56px;
      height: 56px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    .welcome-text h2 {
      font-size: 18px;
      margin-bottom: 4px;
    }

    .welcome-text p {
      font-size: 12px;
      opacity: 0.9;
    }

    /* 2. 今日氧气地图 */
    .map-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 10px;
    }

    .map-item {
      background: #F8FAF9;
      padding: 12px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .map-icon {
      font-size: 20px;
    }

    .map-info .label {
      font-size: 11px;
      color: var(--text-sub);
    }

    .map-info .val {
      font-size: 16px;
      font-weight: bold;
      color: var(--primary-color);
    }

    .map-hint {
      margin-top: 12px;
      font-size: 12px;
      color: var(--primary-color);
      background: var(--primary-light);
      padding: 8px 12px;
      border-radius: 8px;
      text-align: center;
    }

    /* 3. 今日氧气建议 */
    .suggestion-card {
      border-left: 4px solid var(--primary-color);
    }

    .sug-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .sug-title {
      font-weight: bold;
      font-size: 15px;
    }

    .sug-tip {
      font-size: 13px;
      color: var(--text-main);
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .sug-product-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      background: #FFF9E6;
      color: #D63031;
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: 600;
    }

    /* 4. 氧气变化小卡 (简版) */
    .change-grid {
      display: flex;
      justify-content: space-around;
      text-align: center;
      margin-top: 8px;
    }

    .change-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .change-label {
      font-size: 11px;
      color: var(--text-sub);
    }

    .change-delta {
      font-size: 15px;
      font-weight: bold;
      color: var(--primary-color);
    }

    /* 5. 功能入口区 (人格 & 聊天) */
    .entry-banner {
      background: linear-gradient(135deg, #A8E6CF 0%, #DCEDC1 100%);
      border-radius: var(--radius-lg);
      padding: 14px 18px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .entry-banner h3 {
      font-size: 14px;
      color: #2D3436;
    }

    .entry-banner p {
      font-size: 11px;
      color: #636E72;
      margin-top: 2px;
    }

    .entry-btn {
      background: #2D3436;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 11px;
    }

    /* TabBar 导航栏 */
    .tab-bar {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 65px;
      background: #FFFFFF;
      border-top: 1px solid #EAEAEA;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding-bottom: 8px;
    }

    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 10px;
      color: var(--text-sub);
      cursor: pointer;
    }

    .tab-item.active {
      color: var(--primary-color);
      font-weight: bold;
    }

    .tab-icon {
      font-size: 18px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- 滚动内容区 -->
    <div class="main-content">
      
      <!-- 1. 氧氧欢迎区 -->
      <div class="card welcome-card">
        <div class="ip-avatar">☁️</div>
        <div class="welcome-text">
          <h2>HI，氧友！</h2>
          <p>我是氧氧，今天也为你准备好了满满活力~</p>
        </div>
      </div>

      <!-- 2. 今日氧气地图 -->
      <div class="card">
        <div class="card-title">
          今日氧气地图
          <span class="card-subtitle">实时感测</span>
        </div>
        <div class="map-grid" id="mapGrid">
          <!-- 动态渲染 -->
        </div>
        <div class="map-hint" id="mapHint">正在生成当前氧气状态...</div>
      </div>

      <!-- 3. 今日氧气建议 -->
      <div class="card suggestion-card">
        <div class="card-title">今日氧气建议</div>
        <div class="sug-header">
          <span id="sugIcon" style="font-size: 20px;">🧠</span>
          <span id="sugTitle" class="sug-title">脑力恢复</span>
        </div>
        <div id="sugTip" class="sug-tip">大脑高强度运转后，建议留 3 分钟富氧放松，帮思路重新清亮。</div>
        <div id="sugProductTag" class="sug-product-tag">
          ⚡ 推荐装备：Work Air 充氧宝 · 桌面款
        </div>
      </div>

      <!-- 4. 氧气变化小卡 (简版) -->
      <div class="card">
        <div class="card-title">
          吸氧前后对比
          <span class="card-subtitle">模拟体验数据</span>
        </div>
        <div class="change-grid" id="changeGrid">
          <!-- 动态渲染 -->
        </div>
      </div>

      <!-- 5. 发现氧气人格入口 -->
      <div class="entry-banner">
        <div>
          <h3>探索你的氧系人格</h3>
          <p>基于 MBTI 匹配你的专属充氧方案</p>
        </div>
        <button class="entry-btn">去测试</button>
      </div>

      <!-- 6. 氧氧聊天入口 -->
      <div class="entry-banner" style="background: linear-gradient(135deg, #E0C3FC 0%, #8EC5FC 100%);">
        <div>
          <h3>找氧氧聊聊天</h3>
          <p>共情倾听 + 场景化智能答疑</p>
        </div>
        <button class="entry-btn" style="background: #6C5CE7;">去倾诉</button>
      </div>

    </div>

    <!-- TabBar 底部导航 -->
    <div class="tab-bar">
      <div class="tab-item active">
        <span class="tab-icon">🏠</span>
        <span>首页</span>
      </div>
      <div class="tab-item">
        <span class="tab-icon">💬</span>
        <span>氧氧</span>
      </div>
      <div class="tab-item">
        <span class="tab-icon">🧭</span>
        <span>氧气探索</span>
      </div>
      <div class="tab-item">
        <span class="tab-icon">🔌</span>
        <span>充氧宝</span>
      </div>
      <div class="tab-item">
        <span class="tab-icon">👤</span>
        <span>我的</span>
      </div>
    </div>
  </div>

  <!-- 前端逻辑 JS (转化原 Mock 数据库与服务逻辑) -->
  <script>
    // === 1. 模拟 mock/oxygen-map-db.js ===
    const MAP_METRICS = [
      { key: 'emotion', label: '情绪能量', icon: '🌱' },
      { key: 'oxygen', label: '身体含氧感', icon: '🫁' },
      { key: 'vigor', label: '活力指数', icon: '⚡' },
      { key: 'recover', label: '恢复状态', icon: '🌙' }
    ];

    function getOxygenMap(scene) {
      const metrics = MAP_METRICS.map(m => ({
        ...m,
        value: Math.floor(60 + Math.random() * 30)
      }));
      const avg = metrics.reduce((s, m) => s + m.value, 0) / metrics.length;
      const level = avg >= 78 ? 'high' : (avg >= 60 ? 'mid' : 'low');
      const hints = {
        high: '状态在线，保持这个好节奏 ☁️',
        mid: '有点起伏，今天值得给自己补一口氧',
        low: '身体在提醒：该好好充充电啦 🌫'
      };
      return { metrics, hint: hints[level] };
    }

    // === 2. 模拟 mock/oxygen-suggestion-db.js ===
    function getSuggestion() {
      return {
        icon: '🧠',
        title: '脑力恢复',
        tip: '大脑高强度运转后，建议留 3 分钟富氧放松，帮思路重新清亮。',
        product: 'Work Air 充氧宝 · 桌面款'
      };
    }

    // === 3. 模拟 mock/oxygen-change-db.js ===
    function getOxygenChange() {
      return [
        { label: '疲劳感', deltaText: '↓38%' },
        { label: '专注力', deltaText: '↑39%' },
        { label: '活力值', deltaText: '↑32%' }
      ];
    }

    // === 页面初始化渲染 ===
    document.addEventListener('DOMContentLoaded', () => {
      // 渲染今日氧气地图
      const mapData = getOxygenMap('脑力');
      const mapGridEl = document.getElementById('mapGrid');
      mapGridEl.innerHTML = mapData.metrics.map(m => `
        <div class="map-item">
          <span class="map-icon">${m.icon}</span>
          <div class="map-info">
            <div class="label">${m.label}</div>
            <div class="val">${m.value}%</div>
          </div>
        </div>
      `).join('');
      document.getElementById('mapHint').innerText = mapData.hint;

      // 渲染今日氧气建议
      const sug = getSuggestion();
      document.getElementById('sugIcon').innerText = sug.icon;
      document.getElementById('sugTitle').innerText = sug.title;
      document.getElementById('sugTip').innerText = sug.tip;
      document.getElementById('sugProductTag').innerText = `⚡ 推荐装备：${sug.product}`;

      // 渲染吸氧前后对比
      const changeData = getOxygenChange();
      const changeGridEl = document.getElementById('changeGrid');
      changeGridEl.innerHTML = changeData.map(c => `
        <div class="change-item">
          <span class="change-label">${c.label}</span>
          <span class="change-delta">${c.deltaText}</span>
        </div>
      `).join('');
    });
  </script>
</body>
</html>
