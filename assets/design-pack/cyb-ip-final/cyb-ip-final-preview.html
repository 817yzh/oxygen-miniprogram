<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>CYB final IP preview</title>
<style>
  body{margin:0;background:#F6FFFB;font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif;color:#061B2B}
  main{max-width:1120px;margin:0 auto;padding:42px 24px}
  h1{font-size:28px;margin:0 0 10px}
  p{margin:0 0 24px;color:#4A6472;line-height:1.7}
  .grid{display:grid;grid-template-columns:360px 1fr;gap:28px;align-items:start}
  .panel{background:#fff;border:1px solid rgba(53,214,184,.22);border-radius:24px;padding:24px;box-shadow:0 18px 60px rgba(31,95,168,.12)}
  .single{width:100%;height:auto}
  .states{width:100%;height:auto;border-radius:16px}
  code{background:#E8FBF6;border-radius:8px;padding:2px 7px}
</style>
<main>
  <h1>充氧宝最终版 IP 素材预览</h1>
  <p>透明源文件用于替换小程序和网页里的主舞台、漂浮陪伴、呼吸页小形象、分享卡同框形象。状态只改氧芯色、光感、气泡和表情，不改 IP 外壳。</p>
  <div class="grid">
    <section class="panel">
      <img class="single" src="./cyb-ip-final-source.svg" alt="final IP transparent source">
    </section>
    <section class="panel">
      <img class="states" src="./cyb-ip-final-states.svg" alt="8 state board">
      <p>前端接入以 <code>cyb-ip-final-integration.md</code> 为准。</p>
    </section>
  </div>
</main>
</html>
